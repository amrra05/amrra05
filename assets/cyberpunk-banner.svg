<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Amr Alramahi — Full Stack Developer</title>
<desc id="desc">Cyberpunk neon banner with a futuristic grid, glowing cyan and violet lines.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070512"/><stop offset=".52" stop-color="#140B2B"/><stop offset="1" stop-color="#03151D"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A855F7"/><stop offset=".52" stop-color="#7C3AED"/><stop offset="1" stop-color="#00E5FF"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#7C3AED" stop-opacity=".32"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#8B5CF6" stroke-opacity=".16" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<ellipse cx="250" cy="100" rx="300" ry="210" fill="url(#glow)" filter="url(#blur)"/>
<ellipse cx="1050" cy="280" rx="290" ry="190" fill="#00D9FF" opacity=".10" filter="url(#blur)"/>
<path d="M0 286 L210 286 L252 244 L390 244 L430 204 L570 204" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".7"/>
<path d="M1200 82 L1030 82 L990 122 L870 122 L830 162 L710 162" fill="none" stroke="#00D9FF" stroke-width="2" opacity=".55"/>
<path d="M60 40h120M60 40v48M1140 320h-120m120 0v-48" stroke="#00D9FF" stroke-width="2" opacity=".7"/>
<g fill="#00E5FF"><circle cx="210" cy="286" r="4"/><circle cx="990" cy="122" r="4"/><circle cx="570" cy="204" r="3"/></g>
<g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
  <text x="600" y="137" fill="#A78BFA" font-size="17" letter-spacing="7">HELLO WORLD / I'M</text>
  <text x="600" y="205" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="3">AMR ALRAMAHI</text>
  <text x="600" y="247" fill="#00E5FF" font-size="20" letter-spacing="4">FULL-STACK DEVELOPER</text>
  <text x="600" y="290" fill="#B9B2D0" font-size="14" letter-spacing="2">C#  /  ASP.NET CORE  /  REACT  /  SQL SERVER</text>
</g>
<path d="M350 222H850" stroke="url(#neon)" stroke-width="1.5" opacity=".9"/>
<path d="M350 226H850" stroke="#00D9FF" stroke-width="5" opacity=".22" filter="url(#soft)"/>
</svg>
